name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate the harness
        run: node scripts/validate-harness.mjs
      - name: Check generated router files are in sync
        run: node scripts/sync-harnesses.mjs --repo --check
      - name: Prove the installer is idempotent
        run: node scripts/check-install.mjs
      - name: Autonomous smoke test
        run: node scripts/run-autonomous-smoke-test.mjs
