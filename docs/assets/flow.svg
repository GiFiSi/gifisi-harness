<title id="t">How gifisi-harness handles a task</title><desc id="d">A prompt goes to the router, which prints a header and selects one playbook. The playbook steps become todos, skills load on demand, and the task ends when the done predicate is observed live.</desc>
<g><rect x="15" y="20" width="170" height="92" rx="14" fill="#1b2142"/><rect x="33" y="20" width="134" height="5" rx="2.5" fill="#8b94b5"/><text x="100" y="68" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#f1f3ff">prompt</text><text x="100" y="94" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#aab3d6">a real task</text></g><path d="M193 66 h24" stroke="#8b94b5" stroke-width="2.5" stroke-linecap="round"/><path d="M210 59 l8 7 l-8 7" fill="none" stroke="#8b94b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="225" y="20" width="170" height="92" rx="14" fill="#1b2142"/><rect x="243" y="20" width="134" height="5" rx="2.5" fill="#2dd4bf"/><text x="310" y="68" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#f1f3ff">router</text><text x="310" y="94" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#aab3d6">prints header</text></g><path d="M403 66 h24" stroke="#8b94b5" stroke-width="2.5" stroke-linecap="round"/><path d="M420 59 l8 7 l-8 7" fill="none" stroke="#8b94b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="435" y="20" width="170" height="92" rx="14" fill="#1b2142"/><rect x="453" y="20" width="134" height="5" rx="2.5" fill="#a78bfa"/><text x="520" y="68" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#f1f3ff">playbook</text><text x="520" y="94" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#aab3d6">steps = todos</text></g><path d="M613 66 h24" stroke="#8b94b5" stroke-width="2.5" stroke-linecap="round"/><path d="M630 59 l8 7 l-8 7" fill="none" stroke="#8b94b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="645" y="20" width="170" height="92" rx="14" fill="#1b2142"/><rect x="663" y="20" width="134" height="5" rx="2.5" fill="#a78bfa"/><text x="730" y="68" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#f1f3ff">skills</text><text x="730" y="94" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#aab3d6">on demand</text></g><path d="M823 66 h24" stroke="#8b94b5" stroke-width="2.5" stroke-linecap="round"/><path d="M840 59 l8 7 l-8 7" fill="none" stroke="#8b94b5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="855" y="20" width="170" height="92" rx="14" fill="#1b2142"/><rect x="873" y="20" width="134" height="5" rx="2.5" fill="#2dd4bf"/><text x="940" y="68" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" font-weight="700" fill="#f1f3ff">predicate</text><text x="940" y="94" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" fill="#aab3d6">observed live</text></g>
